<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#EFD7A7"/>
      <stop offset="55%"  stop-color="#DCB979"/>
      <stop offset="100%" stop-color="#A87E3F"/>
    </linearGradient>
  </defs>

  <!-- Fondo negro con bordes redondeados -->
  <rect width="100" height="100" rx="16" fill="#070707"/>

  <!-- Línea diagonal superior (el "techo" inclinado del logo) -->
  <polygon points="15,42 70,16 70,23 15,50" fill="url(#gold)"/>

  <!-- Lama 1 -->
  <rect x="15" y="55" width="55" height="8" rx="1.5" fill="url(#gold)"/>
  <!-- Lama 2 -->
  <rect x="15" y="68" width="55" height="8" rx="1.5" fill="url(#gold)"/>
  <!-- Lama 3 -->
  <rect x="15" y="81" width="55" height="8" rx="1.5" fill="url(#gold)"/>
</svg>
